<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600"><rect width="2400" height="1600" fill="#182332"/><rect width="2400" height="120" fill="#101923"/><text x="110" y="78" font-family="Helvetica" font-size="40" fill="#aebfd1">Geometry.swift — Glass Image Tools</text><g font-family="Menlo,monospace"><text x="130" y="230" font-size="36" fill="#d8e2ee">//&#160;Source-pixel&#160;coordinates&#160;stay&#160;independent&#160;of&#160;zoom.</text><text x="130" y="287" font-size="36" fill="#d8e2ee">struct&#160;CropRegion&#160;{</text><text x="130" y="344" font-size="36" fill="#d8e2ee">&#160;&#160;&#160;&#160;var&#160;origin:&#160;CGPoint</text><text x="130" y="401" font-size="36" fill="#d8e2ee">&#160;&#160;&#160;&#160;var&#160;size:&#160;CGSize</text><text x="130" y="458" font-size="36" fill="#d8e2ee"></text><text x="130" y="515" font-size="36" fill="#d8e2ee">&#160;&#160;&#160;&#160;var&#160;pixelCount:&#160;Int&#160;{</text><text x="130" y="572" font-size="36" fill="#d8e2ee">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;Int(size.width)&#160;*&#160;Int(size.height)</text><text x="130" y="629" font-size="36" fill="#d8e2ee">&#160;&#160;&#160;&#160;}</text><text x="130" y="686" font-size="36" fill="#d8e2ee">}</text><text x="130" y="743" font-size="36" fill="#d8e2ee"></text><text x="130" y="800" font-size="36" fill="#d8e2ee">let&#160;region&#160;=&#160;CropRegion(</text><text x="130" y="857" font-size="36" fill="#d8e2ee">&#160;&#160;&#160;&#160;origin:&#160;CGPoint(x:&#160;40,&#160;y:&#160;150),</text><text x="130" y="914" font-size="36" fill="#d8e2ee">&#160;&#160;&#160;&#160;size:&#160;CGSize(width:&#160;2060,&#160;height:&#160;1390)</text><text x="130" y="971" font-size="36" fill="#d8e2ee">)</text><text x="130" y="1028" font-size="36" fill="#d8e2ee"></text><text x="130" y="1085" font-size="36" fill="#d8e2ee">//&#160;Render&#160;a&#160;new&#160;image.&#160;Keep&#160;the&#160;original&#160;unchanged.</text><text x="130" y="1142" font-size="36" fill="#d8e2ee">let&#160;output&#160;=&#160;try&#160;renderer.render(source,&#160;crop:&#160;region)</text></g></svg>