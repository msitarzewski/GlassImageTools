name: Website

# Builds site/ (plus PRIVACY.md) with scripts/build_site.py and publishes it to GitHub Pages, as AutoPaper's
# does. Only the deploy job can publish, and each action is pinned to the commit of the release named beside it.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - PRIVACY.md
      - scripts/build_site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned pandoc
        timeout-minutes: 4
        run: |
          archive="$RUNNER_TEMP/pandoc.tar.gz"
          curl --fail --location --retry 2 --max-time 120 \
            https://github.com/jgm/pandoc/releases/download/3.13/pandoc-3.13-linux-amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '38aa33b325a2bc96a4c39409631212db55702f564250bcdbead180b3bf646389' "$archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/pandoc"
          tar -xzf "$archive" -C "$RUNNER_TEMP/pandoc" --strip-components=1
          echo "$RUNNER_TEMP/pandoc/bin" >> "$GITHUB_PATH"
      - name: Build
        run: python3 scripts/build_site.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
